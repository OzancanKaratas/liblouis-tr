# Turkish Braille Tests for tr-g1.ctb
# Created: 2025-11-25

display: unicode.dis
table: tr-g1.ctb
flags: {testmode: bothDirections}

# Tests for letter corrections exclusively focused on ıI and iİ which are made in tr.ctb
# Tests were made in other tables to provide consistency

tests:
  - - "Iğdır'a gittim."
    - ⠠⠔⠣⠙⠔⠗⠄⠰⠁⠀⠛⠊⠞⠞⠊⠍⠲

  - - "Ilık havada çıktık."
