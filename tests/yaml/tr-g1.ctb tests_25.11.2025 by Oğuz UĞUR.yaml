flags: {testmode: forward}

# Corrections for dot and comma with numsign
# These tests must be made for only forward mode

tests:
  - - "no.3 No.3"
    - ⠝⠕⠲⠼⠉⠀⠠⠝⠕⠲⠼⠉
  
  - - "no,3 No,3"
    - ⠝⠕⠂⠼⠉⠀⠠⠝⠕⠂⠼⠉

